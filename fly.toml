# fly.toml app configuration file generated for catchat-back on 2026-05-02T18:10:13-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'catchat-back'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  AMOUNT_PIX_MESSAGE_ONLY = '0001' #'1700'
  AMOUNT_PIX_MESSAGE_TUNNEL = '0002' #'2100'
  AMOUNT_PIX_UNLIMITED = '0003' #'4700'
  DEBOUNCE_DELAY_MS = '5000'
  NODE_ENV = 'production'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = 'true'
  RATE_LIMIT_MAX_MESSAGES = '10'
  RATE_LIMIT_WINDOW_MS = '60000'
  STARTUP_MESSAGE_TOLERANCE_MS = '30000'
  START_RATE_LIMIT = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
